services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: trialbridge
      POSTGRES_PASSWORD: trialbridge
      POSTGRES_DB: trialbridge
    ports:
      - "5432:5432"
    volumes:
      - trialbridge_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trialbridge -d trialbridge"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Host "localhost" in .env is the laptop, not this container.
      DATABASE_URL: postgresql://trialbridge:trialbridge@db:5432/trialbridge
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  trialbridge_pgdata:
